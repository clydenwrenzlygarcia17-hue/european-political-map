<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>European Political Map — Interactive</title>
  <link rel="stylesheet" href="style.css">
</head>
 
 <button
  type="button"
  class="music-toggle"
  id="musicToggle"
  aria-label="Mute music">
  🔊
</button>

<body>

<div class="page" id="page">

  <!-- STARTUP INTRO -->
<div class="startup-intro" id="startupIntro" aria-label="Opening animation">
  <div class="startup-blur"></div>

  <div class="startup-content">
    <div class="startup-line"></div>

    <img
      src="assets/header2.png"
      class="startup-header"
      alt="European Political Map"
    >

    <div class="startup-subtitle">
      EUROPEAN POLITICAL MAP
    </div>

    <div class="startup-loading">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div class="startup-scan"></div>

  <button
    class="startup-skip"
    id="startupSkip"
    type="button"
    aria-label="Skip introduction"
  >
    TAP TO CONTINUE
  </button>
</div>
<!-- END STARTUP INTRO -->

  <header class="site-header"
          id="headerTrigger"
          tabindex="0"
          role="button"
          aria-label="About this map">

    <img src="assets/header.png"
         alt="European Political Map"
         class="header-img">

    <span class="header-hint">tap the title for notes</span>

  </header>

 


  <main class="map-shell">

    <div class="map-frame" id="mapFrame">

      <img src="assets/basis.png"
           alt="European political map, coloured by system of government"
           class="basis-img"
           id="basisImg"
           draggable="false">
           <img src="assets/map-mode.png"
     alt="European political map — Map Mode"
     class="map-mode-img"
     id="mapModeImage">


      <!-- Glow overlays -->

      <img src="assets/mask_blue.png"
           class="glow"
           data-glow="blue"
           alt=""
           draggable="false">

      <img src="assets/mask_orange_red.png"
           class="glow"
           data-glow="red"
           alt=""
           draggable="false">

      <img src="assets/mask_green.png"
           class="glow"
           data-glow="green"
           alt=""
           draggable="false">

      <img src="assets/mask_violet.png"
           class="glow"
           data-glow="violet"
           alt=""
           draggable="false">

      <img src="assets/mask_yellow.png"
           class="glow"
           data-glow="yellow"
           alt=""
           draggable="false">


            <!-- Map click layer -->
      <!-- Stage 1: clicking anywhere on the map enters Map Mode -->

      <button 
        class="hit-layer" 
        id="hitLayer" 
        type="button" 
        aria-label="Open map interaction mode">
      </button>

  <!-- =========================================================
       OLD CATEGORY EXPLANATION
       ========================================================= -->

  <div class="overlay-scrim"
       id="scrim"
       hidden>
  </div>


  <aside class="explainer"
         id="explainer"
         hidden
         aria-hidden="true">

    <div class="explainer-head">

      <span class="explainer-dot"
            id="explainerDot">
      </span>

      <h2 id="explainerTitle">
        Title
      </h2>

      <button
        type="button"
        class="explainer-close"
        id="explainerClose"
        aria-label="Close">
        ✕
      </button>

    </div>


    <div class="explainer-body"
         id="explainerBody">

      <!-- Filled by explanations{} in script.js -->

    </div>

  </aside>


  <!-- =========================================================
       STAGE 1 — MAP MODE
       ========================================================= -->

  <div class="map-mode-panel"
       id="mapModePanel"
       hidden
       aria-hidden="true">

    <div class="map-mode-head">

      <div>

        <span class="map-mode-label">
          MAP MODE
        </span>

        <h2>
          Explore the Map
        </h2>

      </div>


      <button
        type="button"
        class="map-mode-close"
        id="mapModeClose"
        aria-label="Close map mode">
        ✕
      </button>
      

    </div>


    <div class="map-mode-body">

      <p>
        Select an area of the map to explore its political system.
      </p>

      <div class="map-mode-placeholder">
        Country information will appear here in the next stage.
      </div>

    </div>


    <div class="map-mode-footer">

      <button
        type="button"
        class="map-reset-button"
        id="mapResetButton">
        Reset View
      </button>

    </div>

  </div>


</div>

</div>

<audio id="backgroundMusic" loop>
  <source src="assets/FairyTail.mp3" type="audio/mpeg">
</audio>
